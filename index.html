    <script>
        function shareToSocial(platform, customText) {
            const url = encodeURIComponent(window.location.href);
            const defaultText = "I'm dodging rugs in the Trenches. Can you capture the Alpha?";
            const text = encodeURIComponent(customText || defaultText);
            
            let shareUrl = '';
            switch(platform) {
                case 'twitter':
                    shareUrl = `https://twitter.com/intent/tweet?url=${url}&text=${text}`;
                    break;
                case 'facebook':
                    shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
                    break;
                case 'linkedin':
                    shareUrl = `https://www.linkedin.com/shareArticle?mini=true&url=${url}&title=${text}`;
                    break;
            }
            
            if(shareUrl) window.open(shareUrl, '_blank');
        }

       
        function shareLoss(score) {
            const msg = `I just got rugged at ${score} points in the Trench. Don't miss the next drop!`;
            shareToSocial('twitter', msg);
        }
    </script>
